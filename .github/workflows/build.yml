name: build

# 构建：push main / 打 tag v* / 手动都会跑（产出 Artifacts）
# Release：仅 tag v* 或手动勾选 publish_release 时才发（先验证再发版）
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build.yml"
      - "upstream.version"
      - "packaging/**"
  workflow_dispatch:
    inputs:
      zcode_ref:
        description: "ZCode ref (tag / branch / commit)，留空用 upstream.version 里钉住的值"
        required: false
        default: ""
      publish_release:
        description: "验证通过后发布 GitHub Release（勾选才发）"
        type: boolean
        required: false
        default: false

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"

jobs:
  runtime:
    name: Build ZCode web runtime (linux)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Resolve pinned ZCode ref
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.zcode_ref }}" ]; then
            REF="${{ github.event.inputs.zcode_ref }}"
          else
            REF="$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/upstream.version")"
          fi
          REF="$(echo "$REF" | head -n 1 | tr -d '[:space:]')"
          echo "Pinned ZCode ref: $REF"
          # upstream.version 应始终钉 40 位 commit sha（上游无 release tag）；
          # 也兼容分支/tag 名。注意 git ls-remote 无法解析裸 SHA，要先判长度。
          if [ "${#REF}" -eq 40 ] && [[ "$REF" =~ ^[0-9a-f]+$ ]]; then
            SHA="$REF"
          else
            SHA="$(git ls-remote https://github.com/zai-org/ZCode.git "$REF" | awk '{print $1}')"
            [ -n "$SHA" ] || { echo "ref 不存在：$REF"; exit 1; }
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned ZCode commit: $SHA"

      - name: Checkout ZCode at pinned commit
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ steps.pin.outputs.sha }}
          path: zcode
          fetch-depth: 1

      - name: Setup Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
        # Node 版本在下一步装（mise 钉 24.14.0）

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: zcode
        run: pnpm install --frozen-lockfile

      - name: Build runtime
        working-directory: zcode
        run: |
          set -e
          # packages/{shared,services,client} 没有 build 脚本，其 dist 由根 typecheck
          # （tsc -b，composite 工程会真实产出 JS）生成；TUI runtime 闭包收集器要求
          # 这些 dist 存在，否则报 Missing @zcode/shared dist files。
          pnpm typecheck
          # build:zcode = 官方打包入口：先构建 CLI 及依赖，再构建 server/web，
          # 最后组装 runtime tarball。
          node scripts/build-zcode.mjs --base-url http://127.0.0.1/zcode/

      - name: Resolve version
        id: ver
        working-directory: zcode
        run: |
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ZCode version: $VERSION"

      - name: Collect artifacts
        working-directory: zcode
        run: |
          mkdir -p ../out
          cp dist/zcode/releases/*/zcode-*.tar.gz ../out/
          cp dist/zcode/latest.json ../out/ 2>/dev/null || true
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-runtime-${{ steps.ver.outputs.version }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  fpk:
    name: Package fnOS fpk
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: zcode-runtime-${{ needs.runtime.outputs.version }}
          path: packaging/fnOS/dist/runtime

      - name: Build fpk
        run: bash packaging/fnOS/scripts/build.sh

      - name: Verify fpk contents
        run: |
          FPK="$(ls packaging/fnOS/dist/zcode-*.fpk)"
          echo "fpk: $FPK ($(du -h "$FPK" | cut -f1))"
          LIST="$(tar -tzf "$FPK")"
          echo "$LIST" | head -20
          # 安装向导缺失会导致 App Center 读不到访问令牌字段
          echo "$LIST" | grep -q '^wizard/install$' || { echo "✗ fpk 缺少 wizard/install"; exit 1; }
          echo "$LIST" | grep -q '^cmd/main$' || { echo "✗ fpk 缺少 cmd/main"; exit 1; }
          echo "✓ fpk 结构检查通过"

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-${{ needs.runtime.outputs.version }}-fpk
          path: packaging/fnOS/dist/zcode-*.fpk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [runtime, fpk]
    # 只有：推送 v* tag，或手动 workflow 且勾选 publish_release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh 在无 git 仓库目录会报 fatal: not a git repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fpk artifact
        uses: actions/download-artifact@v4
        with:
          name: zcode-${{ needs.runtime.outputs.version }}-fpk
          path: dist

      # artifact 在 UI 上是 zip；download-artifact 会解压，但目录层级可能嵌套。
      # Release 要的是里面的 .fpk 本体，这里统一摊平并定位。
      - name: Locate .fpk (unpack if needed)
        run: |
          set -euo pipefail
          echo "download tree:"
          find dist -maxdepth 4 -print | sed 's/^/  /'
          # 若仍是 zip（少见），就地解压
          find dist -type f -name '*.zip' | while read -r z; do
            echo "unzip: $z"
            unzip -o "$z" -d "$(dirname "$z")"
          done
          # 取唯一的 zcode-*.fpk
          FPK="$(find dist -type f -name 'zcode-*.fpk' | head -n 1)"
          if [ -z "$FPK" ]; then
            echo "✗ 未找到 zcode-*.fpk，dist 内容如上"
            exit 1
          fi
          mkdir -p release
          cp -f "$FPK" "release/$(basename "$FPK")"
          echo "fpk_path=release/$(basename "$FPK")" >> "$GITHUB_ENV"
          echo "✓ 定位到 $(basename "$FPK") ($(du -h "$FPK" | cut -f1))"

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.runtime.outputs.version }}
          UPSTREAM_SHA: ${{ needs.runtime.outputs.sha }}
        run: |
          set -euo pipefail
          # tag 触发时用 tag 名；手动发布用 v<版本>
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          FPK="${fpk_path:?}"
          BASENAME="$(basename "$FPK")"
          SUM="$(sha256sum "$FPK" | awk '{print $1}')"
          NOTES="$(mktemp)"

          # changelog：上一个 v* tag → HEAD（不含本次 tag）；首次则最近 10 条
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${TAG}" | head -n 1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD")"
            CHANGE_HEADER="自 \`${PREV_TAG}\` 以来："
          else
            CHANGES="$(git log --no-merges --pretty=format:'- %s (%h)' -n 10)"
            CHANGE_HEADER="最近提交："
          fi
          if [ -z "${CHANGES}" ]; then
            CHANGES="- （无 commit 说明）"
          fi

          cat > "$NOTES" <<EOF
          ## ZCode ${VERSION} · 飞牛 fnOS 原生版

          - 上游 commit: \`${UPSTREAM_SHA}\`
          - 构建: Actions run ${GITHUB_RUN_ID}
          - \`${BASENAME}\` sha256: \`${SUM}\`

          ### 变更
          ${CHANGE_HEADER}

          ${CHANGES}

          ### 安装
          1. 应用中心安装 **Node.js v22**（或随包自动装）
          2. 下载 \`${BASENAME}\`（fpk 本体，不是 zip）
          3. 应用中心 → 手动安装 → 选该 fpk
          4. 向导填写**访问令牌**（建议 ≥16 位随机字母数字）

          ### 说明
          - 入口：桌面图标（统一网关 / 飞牛登录）+ 端口 8988（令牌登录框）
          - 请勿把 8988 映射公网；上游：[zai-org/ZCode](https://github.com/zai-org/ZCode)
          EOF

          echo "upload asset: $BASENAME sha256=$SUM"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新附件与说明"
            gh release upload "$TAG" "$FPK" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$FPK" \
              --title "ZCode ${VERSION} · fnOS" \
              --notes-file "$NOTES" \
              --target "${GITHUB_SHA}"
          fi
          echo "Done: $TAG ← $BASENAME"
